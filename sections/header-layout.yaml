      - type: custom:layout-card
        layout_type: custom:grid-layout
        cards:
          - type: custom:mushroom-template-card
            primary: |
              {% set time = now().hour %} 
                {% if (time >= 18) %}
                  Good Evening {{user}}!     
                {% elif (time >= 12) %}
                  Good Afternoon {{user}}! 
                {% elif (time >= 5) %}
                  Good Morning {{user}}! 
                {% else %}
                  Hello, {{user}}!      
                {% endif %} 
            secondary: >
              It's {{states('sensor.current_day_and_date')}}
            icon: ''
            picture: |
              {% if user == 'YOUR_HOME_ASSISTANT_USERNAME' %}
                /local/profile_primary.png
              {% else %}
                /local/profile_default.png
              {% endif %}
            multiline_secondary: true
            tap_action:
              action: none
            double_tap_action:
              action: none
            icon_tap_action:
              action: none
            hold_action:
              action: none
            features_position: bottom
            card_mod:
              style: |
                  ha-card {
                    color: white;
                    background-color: rgba(0,0,0,0);
                    box-shadow: none;
                    border: none;
                  }
          - type: custom:mushroom-chips-card
            alignment: end
            chips:
              - type: weather
                entity: weather.home
                tap_action:
                  action: navigate
                  navigation_path: '#weather'
                hold_action:
                  action: navigate
                  navigation_path: '#weather'
                show_conditions: true
                show_temperature: true
            card_mod:
              style: |
                ha-card {
                  --chip-border-width: 0;
                  --chip-background: none;
                  --chip-height: 35px;
                  --chip-padding: 12px;
                  {% if states('weather.home') in ['unavailable', 'unknown'] %}
                    display: none !important;
                  {% endif %}
                }
        layout:
          grid-template-columns: 61% 39%
          grid-template-areas: |
            "left right"
          grid-gap: 0px
