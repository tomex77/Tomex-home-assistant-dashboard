                  right: 0;
                  top: 50%;
                  height: 1px;
                  background: linear-gradient(90deg, transparent, rgba(228,233,229,0.3) 20%, rgba(228,233,229,0.5) 50%, rgba(228,233,229,0.3) 80%, transparent);
                  box-shadow: 0 0 6px rgba(228,233,229,0.2);
                  z-index: 0;
                }
                ha-card {
                  position: relative;
                  overflow: visible !important;
                }
                .name {
                  z-index: 1;
                  position: relative;
                  background: var(--ha-card-background, #13161d);
                  padding-right: 12px !important;
                }
          - type: icon
            icon: mdi:bell
            entity: counter.notification
            tap_action:
              action: none
            hold_action:
              action: none
            style:
              top: 95.5%
              left: 78%
              width: 12px
              z-index: 4
            card_mod:
              style:
                ha-icon$: |
                  ha-svg-icon {
                    {% set count = state_attr('sensor.dashboard_home_notification', 'alert_count') | int(0) %}
                    {% set notif = states('counter.notification')|int(0) %}
                    {% set mail = states('counter.mailbox')|int(0) %}
                    {% set trash = states('counter.trash_counter')|int(0) %}
                    animation:
                      {{ 'tilt-jiggle 0.5s infinite' if (notif > 0 or mail > 0 or trash > 0)
                         else 'magnify 1.7s infinite' if count >= 1
                         else 'none' }};
                    transform-origin: center;
                  }
                  @keyframes magnify {
                    0%, 100% { transform: scale(0.9); }
                    50% { transform: scale(1.5); }
                  }
                  @keyframes tilt-jiggle {
                    0%, 100% { transform: rotate(0deg); }
                    25% { transform: rotate(24deg); }
                    50% { transform: rotate(-24deg); }
                    75% { transform: rotate(-12deg); }
                  }
                .: |
                  :host {
                    opacity: {{ 1 if states('counter.notification') | int(0) > 0 else 0 }};
                    transition: opacity 0.3s ease-in-out;
                    pointer-events: none;
                    --mdc-icon-size: 17px;
                  }
                  ha-icon, ha-state-icon {
                    color: rgba(228,233,229,0.5) !important;
                    --icon-color: rgba(228,233,229,0.5) !important;
                  }
          - type: icon
            icon: mdi:email
            entity: counter.mailbox
            tap_action:
              action: none
            hold_action:
              action: none
            style:
              top: 95.5%
              left: 84%
              width: 12px
              z-index: 4
            card_mod:
              style:
                ha-icon$: >
                  ha-svg-icon { animation: magnify 3s ease-in-out infinite;
                  transform-origin: center; } @keyframes magnify { 0%, 100% {
                  transform: scale(1); } 50% { transform: scale(1.2); } }
                .: >
                  :host { opacity: {{ 1 if states('counter.mailbox') | int(0) >
                  0 else 0 }}; transition: opacity 0.3s ease-in-out;
                  pointer-events: none; --mdc-icon-size: 17px; } ha-icon,
                  ha-state-icon { color: rgba(228,233,229,0.5); --icon-color:
                  white; }
          - type: icon
            icon: mdi:trash-can
            entity: counter.trash_counter
            tap_action:
              action: none
            hold_action:
              action: none
            style:
              top: 95.5%
              left: 90%
              width: 12px
              z-index: 4
            card_mod:
              style:
                ha-icon$: >
                  ha-svg-icon { animation: heartbeat 1.5s ease-in-out infinite;
                  transform-origin: center; } @keyframes heartbeat { 0%, 20%,
                  100% { transform: scale(1); } 10%, 30% { transform:
                  scale(1.2); } }
                .: >
                  :host { opacity: {{ 1 if states('counter.trash_counter') |
                  int(0) > 0 else 0 }}; transition: opacity 0.3s ease-in-out;
                  pointer-events: none; --mdc-icon-size: 17px; } ha-icon,
                  ha-state-icon { color: rgba(228,233,229,0.5); --icon-color:
                  white; }
        card_mod:
          style: |
            ha-card {
              background: none !important;
              transform-origin: top center;
              margin-bottom: -5px;
              border: none !important;
            }
