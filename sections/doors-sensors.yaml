      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Doors
            secondary: '{{ states(''sensor.dashboard_doors_status'') }}'
            icon: >-
              {{ 'mdi:door-open' if state_attr('sensor.dashboard_doors_status',
              'any_open')|bool else 'mdi:door-closed' }}
            badge_icon: >-
              {{ 'mdi:exclamation' if
              state_attr('sensor.dashboard_doors_status',
              'any_open')|bool(false) else 'none' }}
            badge_color: >-
              {{ '#BF3530' if state_attr('sensor.dashboard_doors_status',
              'any_open')|bool(false) else 'rgba(0,0,0,0)' }}
            tap_action:
              action: navigate
              navigation_path: '#door'
            features_position: bottom
            card_mod:
              style:
                ha-icon$: >
                  ha-svg-icon { animation: heartbeat 1.5s ease-in-out infinite;
                  transform-origin: center; }

                  @keyframes heartbeat { 0%, 20%, 100% { transform: scale(0.8);
                  } 10%, 30% { transform: scale(1.1); } }
                .: >
                  ha-card { color: white; background: none; box-shadow: none;
                  border: none; }
          - type: custom:mushroom-template-card
            primary: Sensors
            secondary: '{{ states(''sensor.dashboard_sensors_status'') }}'
            icon: mdi:leak
            badge_icon: >-
              {% if state_attr('sensor.dashboard_sensors_status',
              'fire_alert')|bool(false) %} mdi:alert-circle

              {% elif state_attr('sensor.dashboard_sensors_status',
              'leak_count')|int(0) > 0 %} mdi:water

              {% elif state_attr('sensor.dashboard_sensors_status',
              'motion_detected')|bool(false) %} mdi:walk

              {% else %} none {% endif %}
            badge_color: >-
              {% if state_attr('sensor.dashboard_sensors_status',
              'fire_alert')|bool(false) or
              state_attr('sensor.dashboard_sensors_status', 'leak_count')|int(0)
              > 0 %} #BF3530

              {% elif state_attr('sensor.dashboard_sensors_status',
              'motion_detected')|bool(false) %} #985f1c

              {% else %} rgba(0,0,0,0) {% endif %}
            tap_action:
              action: navigate
              navigation_path: '#sensors'
            features_position: bottom
            card_mod:
              style:
                ha-icon$: >
                  ha-svg-icon { animation: flip-hold 5s steps(1) infinite; }

                  @keyframes flip-hold { 0%, 100% { transform: scaleX(1); } 50%
                  { transform: scaleX(-1); } }
                .: >
                  ha-card { color: white; background: none; box-shadow: none;
                  border: none; }
