          - type: image
            entity: weather.home
            image: >-
              data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'
              viewBox='0 0 1 1'%3E%3C/svg%3E
            style:
              top: 50%
              left: 50%
              width: 100%
              height: 100%
              pointer-events: none
              z-index: 3
            card_mod:
              style: |
                :host {
                  background-image: {{ states('sensor.weather_overlay_combined') }};
                  background-repeat: no-repeat;
                  {% set state = states('weather.home') %}
                  {% if state in ['rainy', 'pouring', 'lightning-rainy'] %}
                    background-position: center;
                    background-size: cover;
                    animation: weather-fade 2s ease-in-out forwards;
                    --target-opacity: 0.3;
                  {% elif state == 'lightning' %}
                    background-position: 100% -45%;
                    background-size: 22% auto;
                    transform: rotate(30deg);
                    animation: lightning-flash 4s ease-in-out infinite;
                    --target-opacity: 0.9;
                  {% elif state == 'cloudy' %}
                    background-position: 87% -2%, 23% 2%;
                    background-size: 20% auto, 22% auto;
                    animation: weather-fade 2s ease-in-out forwards;
                    --target-opacity: 0.2;
                  {% elif state == 'partlycloudy' %}
                    background-position: 23% 2%;
                    background-size: 22% auto;
                    animation: weather-fade 2s ease-in-out forwards;
                    --target-opacity: 0.3;
                  {% elif state == 'fog' %}
                    background-position: center;
                    background-size: cover;
                    animation: weather-fade 2s ease-in-out forwards;
                    --target-opacity: 0.3;
                  {% elif state in ['snowy', 'snowy-rainy'] %}
                    background-position: center 29%;
                    background-size: 100% auto;
                    animation: weather-fade 2s ease-in-out forwards;
                    --target-opacity: 0.2;
                  {% elif state in ['sunny', 'exceptional'] %}
                    background-position: 94% 5%;
                    background-size: 15% auto;
                    animation: weather-fade 2s ease-in-out forwards;
                    --target-opacity: 0.5;
                  {% else %}
                    opacity: 0;
                  {% endif %}
                }
                @keyframes weather-fade {
                  0%   { opacity: 0; }
                  100% { opacity: var(--target-opacity); }
                }
                @keyframes lightning-flash {
                  0%, 2%, 4%, 100% { opacity: 0; }
                  1%, 3% { opacity: var(--target-opacity); }
                }
