kiosk_mode:
  hide_header: true
swipe_nav:
  wrap: true
  enable_mouse_swipe: true
  animate_duration: 150
  skip_tabs: 1
  animate: swipe
  swipe_amount: 18
views:
  - title: Home
    theme: Caule Black Aqua
    badges: []
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        cards:
          - type: custom:mushroom-template-card
            primary: |
              {% set time = now().hour %} 
                {% if (time >= 18) %}
                  Good Evening {{user}}!     
                {% elif (time >= 12) %}
                  Good Afternoon {{user}}! 
                {% elif (time >= 5) %}
                  Good Morning {{user}}! 
                {% else %}
                  Hello, {{user}}!      
                {% endif %} 
            secondary: >
              It's {{states('sensor.current_day_and_date')}}
            icon: ''
            picture: |
              {% if user == 'YOUR_HOME_ASSISTANT_USERNAME' %}
                /local/profile_primary.png
              {% else %}
                /local/profile_default.png
              {% endif %}
            multiline_secondary: true
            tap_action:
              action: none
            double_tap_action:
              action: none
            icon_tap_action:
              action: none
            hold_action:
              action: none
            features_position: bottom
            card_mod:
              style: |
                  ha-card {
                    color: white;
                    background-color: rgba(0,0,0,0);
                    box-shadow: none;
                    border: none;
                  }
          - type: custom:mushroom-chips-card
            alignment: end
            chips:
              - type: weather
                entity: weather.home
                tap_action:
                  action: navigate
                  navigation_path: '#weather'
                hold_action:
                  action: navigate
                  navigation_path: '#weather'
                show_conditions: true
                show_temperature: true
            card_mod:
              style: |
                ha-card {
                  --chip-border-width: 0;
                  --chip-background: none;
                  --chip-height: 35px;
                  --chip-padding: 12px;
                  {% if states('weather.home') in ['unavailable', 'unknown'] %}
                    display: none !important;
                  {% endif %}
                }
        layout:
          grid-template-columns: 61% 39%
          grid-template-areas: |
            "left right"
          grid-gap: 0px
      - type: custom:mushroom-template-card
        secondary: >-
          🗓️ {{states('sensor.next_holiday_sensor')}}
          {{states('sensor.countdown_2')}} 
        features_position: bottom
        multiline_secondary: true
        card_mod:
          style: |
            ha-card {
              color: white;
              --secondary-text-color: rgba(200,200,200,0.9);
              background-color: rgba(0,0,0,0);
              box-shadow: none;
              border-style: hidden;
              transform: scale(0.95);
              margin-top: -39px;
              margin-bottom: -16px;
              margin-left: 44px; /* SHIFTS CARD RIGHT */
            }
      - type: picture-elements
        image: /local/homeclosed2w.webp
        elements:
          - type: image
            entity: binary_sensor.window1_overlay
            image: /local/window1_overlay.png
            style:
              left: 50%
              top: 50.1%
              width: 85%
              z-index: 3
            card_mod:
              style: |
                :host {
                  opacity: {{ 0.8 if is_state('binary_sensor.window1_overlay', 'on') else 0 }};
                  transition: opacity 0.3s ease-in-out;
                  will-change: opacity;
                }
          - type: image
            entity: binary_sensor.window2_overlay
            image: /local/window2_overlay.png
            style:
            style:
              left: 50%
              top: 50.1%
              width: 85%
              z-index: 3
            card_mod:
              style: |
                :host {
                  opacity: {{ 0.8 if is_state('binary_sensor.window2_overlay', 'on') else 0 }};
                  transition: opacity 0.3s ease-in-out;
                  will-change: opacity;
                }
          - type: image
            entity: light.living_room_lights
            image: /local/liv1.png
            tap_action:
              action: none
            style:
              left: 51%
              top: 50%
              width: 85%
              z-index: 3
            card_mod:
              style: |
                :host {
                  opacity: {{ states('sensor.living_room_overlay_opacity') }};
                  transition: opacity 0.5s ease-in-out;
                  will-change: opacity;
                }
          - type: image
            entity: light.garage
            image: /local/garlighton1.png
            tap_action:
              action: toggle
            style:
              top: 50%
              left: 50%
              width: 100%
              z-index: 3
            card_mod:
              style: |
                :host {
                  opacity: {{ states('sensor.garage_light_glow_style') | float(0) }};
                  transition: opacity 0.4s ease-in-out;
                  pointer-events: {{ 'auto' if is_state('light.garage', 'on') else 'none' }};
                }
          - type: state-label
            entity: light.front_porch
            label: ' '
            style:
              top: 50%
              left: 31%
              width: 20px
              height: 20px
              z-index: 3
              color: transparent
              font-size: 0px
            card_mod:
              style: |
                :host {
                  background: {{ states('sensor.front_porch_glow_style') }};
                  transition: background 0.4s ease-in-out;
                  filter: blur(2px);
                  pointer-events: none;
                }
          - type: state-label
            entity: light.driveway
            label: ' '
            style:
              top: 28%
              left: 65%
              width: 25px
              height: 35px
              z-index: 3
              color: transparent
              font-size: 0px
            card_mod:
              style: |
                :host {
                  background: {{ states('sensor.driveway_light_glow_style') }};
                  transition: background 0.4s ease-in-out;
                  filter: blur(4px);
                  pointer-events: none;
                }
          - type: state-label
            entity: sensor.my_home_percentage_charged
            style:
              top: 77.6%
              left: 74.8%
              width: 0.7px
              height: 25px
              z-index: 2
              color: transparent
            card_mod:
              style: >
                {% set batt = states('sensor.my_home_percentage_charged') |
                float(0) %} {% set charging =
                is_state('binary_sensor.my_home_battery_charging', 'on') %}
                @keyframes pulse {
                  0%, 100% { opacity: 1; }
                  50% { opacity: 0.4; }
                } :host {
                  opacity: 1;
                  background: {% if batt >= 66.5 %}#35cf02{% elif batt >= 33.3 %}#ffff00{% else %}#ff0000{% endif %};
                  clip-path: inset({{ (100 - batt) | round(1) }}% 0 0 0);
                  transition: clip-path 0.6s ease, background 0.6s ease;
                  will-change: clip-path, background;
                } {% if charging %} :host {
                  animation: pulse 1.2s ease-in-out infinite;
                } {% endif %}
          - type: state-label
            entity: sensor.my_home_percentage_charged
            style:
              top: 82.5%
              left: 71.8%
              width: 25px
              height: 0.5px
              rotate: 90deg
              z-index: 2
              color: transparent
            card_mod:
              style: |
                :host {
                  background: #35cf02;
                  animation: {{ states('sensor.battery_pulse_animation') }};
                  will-change: opacity, background;
                }
          - type: state-label
            entity: sensor.flow_2
            style:
              top: 6%
              left: 62.5%
              width: 11px
              height: 1px
              rotate: 270deg
              z-index: 2
              color: transparent
            card_mod:
              style: |
                @keyframes flow-move {
                  0%   { background-position: -350% 0%; }
                  100% { background-position: 350% 0%; }
                }
                @keyframes flow-move-reverse {
                  0%   { background-position: 350% 0%; }
                  100% { background-position: -350% 0%; }
                }
                :host {
                  background: {{ states('sensor.solar_flow_style') }};
                  background-size: 350% 100%;
                  animation: flow-move 8s linear infinite;
                  animation-delay: -0.5s;
                  will-change: background-position;
                  transform: translateZ(0);
                  backface-visibility: hidden;
                }
          - type: state-label
            entity: sensor.flow_2
